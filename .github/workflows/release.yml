name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TALKSY_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/talksy.jks"
          echo "TALKSY_KEYSTORE_FILE=$RUNNER_TEMP/talksy.jks" >> "$GITHUB_ENV"

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then echo "$GOOGLE_SERVICES" > app/google-services.json; fi

      - name: Build release APK
        env:
          TALKSY_KEYSTORE_PASSWORD: ${{ secrets.TALKSY_KEYSTORE_PASSWORD }}
          TALKSY_KEY_ALIAS: ${{ secrets.TALKSY_KEY_ALIAS }}
          TALKSY_KEY_PASSWORD: ${{ secrets.TALKSY_KEY_PASSWORD }}
          TALKSY_SERVER_URL: ${{ secrets.TALKSY_SERVER_URL }}
          TALKSY_TURN_HOST: ${{ secrets.TALKSY_TURN_HOST }}
          TALKSY_TURN_USER: ${{ secrets.TALKSY_TURN_USER }}
          TALKSY_TURN_PASS: ${{ secrets.TALKSY_TURN_PASS }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle assembleRelease --no-daemon

      - name: Name artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/talksy-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${GITHUB_REF_NAME}.txt"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/talksy-*.apk
          generate_release_notes: true

      - name: Keep mapping privately
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: dist/mapping-*.txt
