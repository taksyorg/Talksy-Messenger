plugins {
    id 'com.android.application'
}

android {
    namespace 'com.talksy.messenger'
    compileSdk 34

    defaultConfig {
        applicationId "com.talksy.messenger"
        def lpFile = rootProject.file("local.properties")
        def lp = new Properties()
        if (lpFile.exists()) { lpFile.withInputStream { lp.load(it) } }
        def cfg = { String name, String def -> project.findProperty(name) ?: System.getenv(name) ?: lp.getProperty(name) ?: def }
        buildConfigField "String", "DEFAULT_BASE_URL", "\"" + cfg("TALKSY_SERVER_URL", "https://your-server.example") + "\""
        buildConfigField "String", "TURN_HOST", "\"" + cfg("TALKSY_TURN_HOST", "turn.your-server.example") + "\""
        buildConfigField "String", "TURN_USER", "\"" + cfg("TALKSY_TURN_USER", "") + "\""
        buildConfigField "String", "TURN_PASS", "\"" + cfg("TALKSY_TURN_PASS", "") + "\""
        manifestPlaceholders = [MAPS_API_KEY: cfg("MAPS_API_KEY", "YOUR_MAPS_API_KEY")]
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            def ks = System.getenv("TALKSY_KEYSTORE_FILE")
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("TALKSY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TALKSY_KEY_ALIAS")
                keyPassword System.getenv("TALKSY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        disable 'MissingTranslation'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'io.github.webrtc-sdk:android:125.6422.07'
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-video:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
